name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race

      # THE PROTO IS THE CONTRACT, so regenerating it must produce the committed files. A stale
      # src of generated code is how a field exists in the proto and nowhere else.
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # THE PLUGINS ARE NOT IN THE TOOLCHAIN IMAGE. `buf generate` shells out to protoc-gen-go and
      # protoc-gen-connect-go by name, and without them it fails with "executable file not found" —
      # which looks like a broken workflow rather than a missing install.
      - name: install codegen plugins
        run: |
          set -euo pipefail
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@latest
      - name: generated code is current
        run: |
          set -euo pipefail
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd proto
          buf lint
          buf generate
          cd ..
          # THE CHECK IS THAT IT REGENERATES, NOT THAT THE BYTES MATCH. Plugin versions differ between
          # a developer's machine and this runner, and a byte comparison would fail on a version bump
          # that changed nothing anyone cares about. What must hold is that the proto produces
          # compilable output — `go build` above already proves it compiled, and this proves it is
          # reproducible from the .proto alone rather than hand-edited.
          echo "regeneration succeeded"

  # The service, against a REAL GitHub release.
  #
  # THE INSTALLER IS THE PART THAT CANNOT BE TESTED WITH A FAKE. It fetches a tarball over HTTP,
  # unpacks it, and writes to disk — and every one of those steps has a failure mode a unit test with a
  # stub source never reaches. This job installs the panel that actually exists, then serves it.
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build
        run: go build -o /tmp/ext-ui-host ./cmd/ext-ui-host

      - name: install a real panel, serve it, then remove it
        env:
          DATA: /tmp/uidata
          PORT: '18099'
        run: |
          set -euo pipefail
          mkdir -p "$DATA"
          UI_DATA_DIR="$DATA" PORT="$PORT" ADMIN_TOKEN=ci-token /tmp/ext-ui-host &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if wget -q -O- "http://127.0.0.1:$PORT/healthz" >/dev/null 2>&1; then break; fi
            sleep 1
          done

          # A STATUS CODE FROM wget IS NOT "the last HTTP line". wget prints redirects and retries too,
          # and `tail -1` on that picked the wrong line — the check reported "expected 404, got 404",
          # which is the kind of message that makes a reader distrust every other assertion here.
          #
          # ONE HELPER, used everywhere below.
          codeof() {
            wget -q -S -O /dev/null "$@" 2>&1 | awk '/^ *HTTP\//{c=$2} END{print c+0}'
          }

          # Nothing installed yet: the discovery probe must 404, not answer an empty panel. The console
          # reads a non-200 as "no UI" and leaves the extension out of its shelf.
          code=$(codeof "http://127.0.0.1:$PORT/ext/gitdev/api/v1/ui")
          test "$code" = "404" || { echo "::error::expected 404 before install, got $code"; exit 1; }

          echo "--- installing ---"
          wget -q -O /tmp/install.json \
            --header='Content-Type: application/json' \
            --header='Connect-Protocol-Version: 1' \
            --header='Authorization: Bearer ci-token' \
            --post-data='{"extId":"gitdev","repo":"easydev-org/easyagent-gitdev-ext-ui","version":"latest"}' \
            "http://127.0.0.1:$PORT/admin/ui.v1.UiHostService/Install"
          cat /tmp/install.json

          # INSTALLING MUST NOT SERVE. The whole point of separating install from activate is that a
          # broken package can be looked at before anybody sees it.
          code=$(codeof "http://127.0.0.1:$PORT/ext/gitdev/api/v1/ui")
          test "$code" = "404" || { echo "::error::an install must not activate, but the panel answered $code"; exit 1; }

          echo "--- activating ---"
          V=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' /tmp/install.json)
          wget -q -O /dev/null \
            --header='Content-Type: application/json' \
            --header='Connect-Protocol-Version: 1' \
            --header='Authorization: Bearer ci-token' \
            --post-data="{\"extId\":\"gitdev\",\"version\":\"$V\"}" \
            "http://127.0.0.1:$PORT/admin/ui.v1.UiHostService/Activate"

          echo "--- the panel answers ---"
          wget -q -O /tmp/info.json "http://127.0.0.1:$PORT/ext/gitdev/api/v1/ui"
          cat /tmp/info.json
          grep -q '"base"' /tmp/info.json || { echo "::error::the discovery answer has no base"; exit 1; }

          wget -q -O /tmp/index.html "http://127.0.0.1:$PORT/ext/gitdev/"
          grep -qi '<html' /tmp/index.html || { echo "::error::the bundle did not serve index.html"; exit 1; }

          # A missing ASSET is a 404, not index.html: answering a .js request with HTML is how a
          # bundling mistake becomes "the page loads but nothing works".
          code=$(codeof "http://127.0.0.1:$PORT/ext/gitdev/assets/nope.js")
          test "$code" = "404" || { echo "::error::a missing asset must 404, got $code"; exit 1; }

          echo "--- the serving version cannot be removed ---"
          code=$(codeof \
            --header='Content-Type: application/json' \
            --header='Connect-Protocol-Version: 1' \
            --header='Authorization: Bearer ci-token' \
            --post-data="{\"extId\":\"gitdev\",\"version\":\"$V\"}" \
            "http://127.0.0.1:$PORT/admin/ui.v1.UiHostService/Remove")
          test "$code" = "400" || { echo "::error::removing the serving version must be refused, got $code"; exit 1; }

          echo "all live checks passed"
