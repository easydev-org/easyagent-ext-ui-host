# THE ADMIN CREDENTIAL, AS ITS OWN OBJECT.
#
# IT IS NOT IN ext-ui-host.yaml, for a reason that bit during the first deployment: a manifest that
# GENERATES a token rotates it on every apply. The Secret changed, the Deployment did not, and the pod
# kept the old value in its environment — env vars are read at start — so /admin answered 401 to a
# token that the Secret said was correct. Diagnosing that means comparing three things that all look
# right.
#
# Keeping it separate makes the intent explicit: this is created once and changed deliberately.
#
#	ADMIN_TOKEN=$(openssl rand -hex 24)
#	kubectl create secret generic ext-ui-host -n dev \
#	  --from-literal=admin-token="$ADMIN_TOKEN" \
#	  --from-literal=github-token=""
#
# A real deployment keeps this in sealed-secrets or an external secret operator rather than here. The
# file exists so the shape is documented, not so it is applied with a literal in it.
#
# AFTER CHANGING IT, THE POD MUST RESTART: the value is read from the environment at start, so a new
# Secret has no effect on a running pod until something recreates it.
apiVersion: v1
kind: Secret
metadata:
  name: ext-ui-host
  namespace: dev
type: Opaque
stringData:
  admin-token: REPLACE_ME
  # Optional: raises the GitHub rate limit, and is REQUIRED when a panel is published from a private
  # repository.
  github-token: ''
