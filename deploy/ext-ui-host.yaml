# The pod, in its namespace.
#
# IT REPLACES THE CONSOLE, AND KEEPS THE CONSOLE'S ADDRESS. The Deployment is named `webui` and selects
# `app: webui`, and the Service is named `webui` — exactly what the old console deployment used. So
# webui.<ns>.svc.cluster.local keeps resolving, the ingress rule keeps working, and no caller learns a
# new name for a change that is supposed to be invisible from outside.
#
# TWO PODS WOULD BE TWO CONSOLES, which is why the name moves rather than being added to: leaving both
# would make webui.<ns> resolve to whichever was ready, and a reader would get one console or the other
# depending on the day.
#
# WHAT IT NEEDS FROM THE CLUSTER:
#   - the agent's Service, for /agent.v1.*
#   - each extension's Service (`<id>-ext`), for /ext/<id>/api/*
#   - a volume at /data, because the installed panels are the only state
#   - egress to github.com, to install from a release
#
# THE PVC IS NOT IN THIS FILE. It is created once by `deploy/pvc.yaml`, because a bound PVC cannot be
# re-applied — it carries a volumeName that this kind of manifest does not — and putting it here would
# make every subsequent apply fail on it while the rest of the rollout proceeded. One failing object in
# the middle of a rollout is worse than a documented second command.
#
#   kubectl apply -f deploy/pvc.yaml        # once
#   kubectl apply -f deploy/ext-ui-host.yaml  # every release
apiVersion: v1
kind: Secret
metadata:
  name: ext-ui-host
  namespace: dev
type: Opaque
stringData:
  # THIS SECRET IS IN THE FILE FOR A FIRST INSTALL, AND SHOULD NOT STAY THERE.
  #
  # Re-applying a manifest that GENERATES a token would rotate it on every rollout — every pod would
  # restart, and anything holding the old value would start failing at /admin. A real deployment keeps
  # the credential out of the repository (sealed-secrets, an external secret operator, or a Secret
  # created by hand) and applies this file with the Secret already present, which is a no-op.
  #
  # Installing a panel writes the files the console then executes at its own origin, so this is a
  # real credential. The service logs a warning when it is empty.
  admin-token: REPLACE_ME
  # Optional: raises the GitHub rate limit, and is REQUIRED when a panel is published from a private
  # repository.
  github-token: ''
---
apiVersion: apps/v1
kind: Deployment
metadata:
  # NAMED `webui`, NOT `ext-ui-host`: this deployment replaces the console, and a different name would
  # leave the old one and this one both claiming the same Service.
  name: webui
  namespace: dev
  labels: { app: webui }
spec:
  replicas: 1
  # THE PANELS LIVE ON A ReadWriteOnce VOLUME, so two replicas could not both mount it — and a rolling
  # update would try to. Recreate is what this StatefulSet-shaped constraint requires of a Deployment.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: webui }
  template:
    metadata:
      # THE SELECTOR THE EXISTING SERVICE ALREADY USES — keeping it is what makes the address
      # survive this change.
      labels: { app: webui }
    spec:
      containers:
        - name: webui
          image: ghcr.io/easydev-org/easyagent-ext-ui-host:v0.1.1
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: PORT, value: '8080' }
            - { name: UI_DATA_DIR, value: /data }
            - { name: CONSOLE_DIR, value: /srv }
            # WHERE THE CONSOLE'S OWN RPC GOES. Unset means the console loads and every call 404s,
            # which the service warns about rather than hiding.
            - { name: AGENT_UPSTREAM, value: agent.dev.svc.cluster.local:80 }
            - { name: EXT_SVC_SUFFIX, value: .dev.svc.cluster.local }
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: ext-ui-host, key: admin-token }
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef: { name: ext-ui-host, key: github-token, optional: true }
          volumeMounts:
            - { name: data, mountPath: /data }
            # THE ROOT FILESYSTEM IS READ-ONLY, and an install stages its work in a temporary
            # directory. Without this mount the first install fails with "read-only file system" —
            # from a directory nobody chose, which is why it is named here rather than left to /tmp
            # being writable by luck.
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: '1', memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: ext-ui-host-data }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  # THE CONSOLE'S EXISTING NAME AND PORT. webui.<ns>.svc.cluster.local:80 is what the ingress and every
  # in-cluster caller already use; renaming it would turn "one pod instead of two" into an outage with
  # a new DNS name to chase.
  name: webui
  namespace: dev
spec:
  selector: { app: webui }
  ports:
    - { name: http, port: 80, targetPort: http }
